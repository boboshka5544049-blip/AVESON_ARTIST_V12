name: AVESON ARTIST APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract AVESON V12
        run: |
          unzip -o AVESON_ARTIST_V12_FULL.zip -d aveson_project
          ls -la aveson_project

      - name: Build Artist APK
        working-directory: aveson_project
        run: gradle :app:assembleDebug --stacktrace

      - name: Check APK
        run: |
          test -f aveson_project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh aveson_project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Artist APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-ARTIST-V12-APK
          path: aveson_project/app/build/outputs/apk/debug/app-debug.apk
